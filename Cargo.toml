[workspace]
members = ["crates/*", "refs/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
numpy = "0.29"
thiserror = "2"
libdeflater = "1"
memchr = "2"
libc = "0.2"
smallvec = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
cc = "1"
libz-sys = { version = "1", default-features = false, features = ["static"] }
proptest = "1"
tempfile = "3"
pco = "1.1"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde_json = "1"
# Builds HDF5 2.x from source (hdf5-metno-src 0.10), which needs CMake 3.26
# or newer.
hdf5-metno = { version = "0.15.1", features = ["static", "zlib"] }
hdf5-metno-sys = { version = "0.12.5", features = ["static", "zlib"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Third-party code (libdeflate, zlib, ...) is optimised in dev and test
# builds; tests that compress data are otherwise dominated by -O0 codecs.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
