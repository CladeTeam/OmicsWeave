name: Build distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build portable wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: '1.16.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --strip --out dist --interpreter python3.12
          before-script-linux: |
            export PATH="/opt/python/cp312-cp312/bin:$PATH"
            python -m pip install uv
            uv pip install --system --python python3.12 'cmake>=3.26,<4' ninja patchelf
            cmake --version
      - name: Validate distribution metadata
        run: uvx --from 'twine>=6,<7' twine check --strict dist/*
      - name: Test installed wheel on supported Python versions
        run: bash .github/scripts/test-wheel.sh dist 3.12 3.13 3.14 3.15
      - name: Test the minimum NumPy version
        env:
          NUMPY_SPEC: numpy==1.26.0
        run: bash .github/scripts/test-wheel.sh dist 3.12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build source distribution
        run: uvx --from maturin==1.16.0 maturin sdist --out dist
      - name: Validate source metadata
        run: uvx --from 'twine>=6,<7' twine check --strict dist/*
      - name: Rebuild and test from the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          uv build --wheel "$RUNNER_TEMP"/sdist/omicsweave-* --out-dir "$RUNNER_TEMP/rebuilt"
          bash .github/scripts/test-wheel.sh "$RUNNER_TEMP/rebuilt" 3.12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
